services:
  postgres:
    image: postgres:15-alpine
    container_name: agentnet-postgres
    environment:
      POSTGRES_USER: agentnet
      POSTGRES_PASSWORD: agentnet_dev
      POSTGRES_DB: agentnet
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U agentnet']
      interval: 5s
      timeout: 5s
      retries: 5

  postgres-test:
    image: postgres:15-alpine
    container_name: agentnet-postgres-test
    environment:
      POSTGRES_USER: agentnet_test
      POSTGRES_PASSWORD: agentnet_test
      POSTGRES_DB: agentnet_test
    ports:
      - '5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U agentnet_test']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
